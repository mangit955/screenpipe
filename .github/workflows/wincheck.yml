name: wincheck
on:
  push:
    branches: [scratch/wincheck-7522]
  workflow_dispatch:
jobs:
  run:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc -V
      - name: WebView2 runtime version
        shell: pwsh
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv, name
          [System.Environment]::OSVersion.VersionString
      - name: Build
        shell: pwsh
        run: cargo build --locked
      - name: Run scenarios
        shell: pwsh
        run: ./run.ps1 -Exe target\debug\wincheck.exe -Out out -Only 's11a control,s11a old,s11a filter,s11a filter,s11a filter,s11b control,s11b old,s11b filter,s11c control,s11c filter,s11d control,s11d filter,s10a filter,s10b filter,s10c filter,s1 filter,s2 filter,s3 filter,s4 filter,s5 filter,s6 filter,s7 filter,s8a filter,s8b filter,s8c filter,s9 control,s9 filter'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wincheck-out
          path: out/
