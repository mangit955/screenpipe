name: linuxcheck

on:
  push:
    branches: [scratch/linuxcheck-7522]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            build-essential pkg-config xvfb gdb dbus
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 libsoup-3.0
          dpkg -l | grep -E 'libwebkit2gtk-4.1-0|libjavascriptcoregtk-4.1-0' || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          rustc --version
          cargo build --locked || cargo build
          cargo tree -i webkit2gtk --depth 0
          cargo tree -i wry --depth 0
          cargo tree -i tao --depth 0

      - name: Run scenarios
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: dbus-run-session -- xvfb-run -a bash run.sh 2>&1 | tee results.log

      - name: Summary
        if: always()
        run: grep -E '^(=====|START|STEP|HUNG|FIX|NAV|PROTO-HIT|HTTP-HIT|TITLE|IPC-HANDLER|SURVIVED|thread|panic|fatal)' results.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.log
